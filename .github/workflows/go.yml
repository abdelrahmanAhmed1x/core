name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ['1.26.5', '1.26.9']
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '${{ matrix.go }}'
          cache: true
      - run: go fmt ./... && git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -coverpkg=./... -coverprofile=coverage.out ./...
      - if: matrix.go == '1.26.9'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - if: matrix.go == '1.26.9'
        run: govulncheck ./...
  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['redis:7.4.2-alpine', 'docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1']
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.26.9'
      - run: scripts/integration.sh '${{ matrix.image }}'
